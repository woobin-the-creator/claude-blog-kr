<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude 블로그 한글 번역</title>
<script>try{var t=localStorage.getItem("cbk:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="posts/assets/site.css">
</head>
<body class="page-home">
  <nav class="site-header" aria-label="사이트">
    <div class="site-header-inner">
      <a class="site-brand" href="index.html" aria-current="page"><span class="brand-mark" aria-hidden="true">KR</span><span class="brand-text">Claude 블로그<span class="brand-sub"> 한글 번역</span></span></a>
      <div class="site-links" id="site-links">
        <a class="site-link library-link" href="library.html">보관함<span id="lib-count" class="count-badge" hidden></span></a>
        <a class="site-link" href="youtube.html">링크 큐</a>
        <a class="site-link" href="write.html">글쓰기</a>
      </div>
      <div class="site-actions">
        <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="테마 전환"><svg class="i-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7z"/></svg><svg class="i-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg></button>
        <button type="button" class="icon-btn menu-toggle" data-menu-toggle aria-expanded="false" aria-controls="site-links" aria-label="메뉴"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
      </div>
    </div>
  </nav>

  <main class="page">
    <div class="home-grid">
      <section class="home-intro" aria-labelledby="home-title">
        <p class="label page-eyebrow">비공식 한국어 아카이브</p>
        <h1 class="page-title" id="home-title">Claude 블로그 한글 번역</h1>
        <p class="page-sub">
          <a href="https://claude.com/blog">claude.com/blog</a>의 글과 AI 영상을 한국어로 옮긴 비공식 모음입니다.
        </p>
        <dl class="home-stats">
          <div><dt class="label">글</dt><dd id="stat-posts">–</dd></div>
          <div><dt class="label">출처</dt><dd id="stat-sources">–</dd></div>
          <div><dt class="label">최근</dt><dd id="stat-latest">–</dd></div>
        </dl>
      </section>

      <section class="home-list" aria-label="글 목록">
        <div class="filters">
          <div class="filter-bar">
            <div class="filter-row cat-row" id="cat-main" role="group" aria-label="출처"></div>
            <button type="button" id="fav-filter" class="chip fav-toggle" aria-pressed="false">★ 즐겨찾기</button>
          </div>
        </div>
        <div class="subfilter cat-sub hidden" id="cat-sub" role="group" aria-label="주제"></div>
        <div class="list-meta"><p class="label count-note" id="count-note"></p></div>

        <ul class="post-list" id="post-list"></ul>
        <p class="empty-msg" id="empty-msg" hidden>조건에 맞는 글이 없습니다.</p>
      </section>
    </div>

    <footer class="site-footer">비공식 번역본 · 정확한 의미는 각 글의 원문/영상 링크를 함께 참고하세요.</footer>
  </main>

  <script src="posts/assets/cbk-config.js"></script>
  <script src="posts/assets/catalog.js"></script>
  <script src="posts/assets/store.js"></script>
  <script src="posts/assets/site.js"></script>
  <script>
  (function () {
    var CBK = window.CBK || null;
    var POSTS = window.CBK_POSTS || [];

    var listEl = document.getElementById("post-list");
    var emptyEl = document.getElementById("empty-msg");
    var noteEl = document.getElementById("count-note");
    var mainRow = document.getElementById("cat-main");
    var subRow = document.getElementById("cat-sub");
    var favBtn = document.getElementById("fav-filter");

    var favOnly = false;
    var selMain = "all";
    var selSub = "all";

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    function distinct(arr) {
      var seen = {}, out = [];
      arr.forEach(function (v) { if (!seen[v]) { seen[v] = 1; out.push(v); } });
      return out;
    }

    /* deep-link: #m=<출처>&c=<주제> */
    (function readHash() {
      var h = location.hash.replace(/^#/, "");
      if (!h) return;
      h.split("&").forEach(function (kv) {
        var p = kv.split("=");
        if (p[0] === "m") selMain = decodeURIComponent(p[1] || "") || "all";
        if (p[0] === "c") selSub = decodeURIComponent(p[1] || "") || "all";
      });
    })();

    function mains() { return distinct(POSTS.map(function (p) { return p.main; })); }
    function subsOf(main) {
      return distinct(POSTS
        .filter(function (p) { return main === "all" || p.main === main; })
        .map(function (p) { return p.cat; }));
    }

    function chip(val, label, on, cls) {
      return '<button type="button" class="' + (cls || "chip") + (on ? " on" : "") +
        '" aria-pressed="' + (on ? "true" : "false") +
        '" data-val="' + esc(val) + '">' + esc(label) + "</button>";
    }

    function buildChips() {
      var mh = chip("all", "전체", selMain === "all", "tab");
      mains().forEach(function (m) { mh += chip(m, m, selMain === m, "tab"); });
      mainRow.innerHTML = mh;
      // 좁은 화면에서 선택된 출처 탭이 가려져 있으면 탭 줄만 가로로 옮긴다(페이지는 안 움직인다).
      var onTab = mainRow.querySelector(".tab.on");
      if (onTab && onTab.getBoundingClientRect) {
        var tr = onTab.getBoundingClientRect(), rr = mainRow.getBoundingClientRect();
        if (tr.right > rr.right - 32) mainRow.scrollLeft += tr.right - rr.right + 48;
        else if (tr.left < rr.left) mainRow.scrollLeft -= rr.left - tr.left + 8;
      }

      if (selMain === "all") {
        subRow.classList.add("hidden");
        subRow.innerHTML = "";
      } else {
        var sh = '<span class="label cat-label">주제</span>' + chip("all", "전체", selSub === "all");
        subsOf(selMain).forEach(function (c) { sh += chip(c, c, selSub === c); });
        subRow.innerHTML = sh;
        subRow.classList.remove("hidden");
      }
    }

    function paintStats() {
      var set = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
      set("stat-posts", POSTS.length || "–");
      set("stat-sources", mains().length || "–");
      set("stat-latest", POSTS.length ? String(POSTS[0].date).slice(5).replace("-", ".") : "–");
    }

    function matches(p) {
      if (selMain !== "all" && p.main !== selMain) return false;
      if (selMain !== "all" && selSub !== "all" && p.cat !== selSub) return false;
      if (favOnly) {
        if (!CBK || !CBK.isBookmarked(CBK.slugOf(p.file))) return false;
      }
      return true;
    }

    function render() {
      buildChips();
      paintStats();
      var shown = POSTS.filter(matches);
      noteEl.textContent = shown.length + "개 글" +
        (selMain === "all" ? "" : " · " + selMain) +
        (selMain !== "all" && selSub !== "all" ? " › " + selSub : "");

      listEl.innerHTML = "";
      var marked = 0;
      POSTS.forEach(function (p) {
        var slug = CBK ? CBK.slugOf(p.file) : p.file.replace(/\.html$/, "");
        var fav = CBK ? CBK.isBookmarked(slug) : false;
        var note = CBK ? CBK.getNote(slug) : "";
        if (fav || note) marked++;
      });

      shown.forEach(function (p) {
        var slug = CBK ? CBK.slugOf(p.file) : p.file.replace(/\.html$/, "");
        var fav = CBK ? CBK.isBookmarked(slug) : false;
        var note = CBK ? CBK.getNote(slug) : "";

        var li = document.createElement("li");
        li.className = "post-row";
        var html =
          '<span class="post-date">' + esc(p.date) + "</span>" +
          '<div class="post-main-col">' +
            '<h2 class="post-title"><a href="post.html?slug=' + encodeURIComponent(p.slug || p.file.replace(/\.html$/, '')) + '">' +
              (fav ? '<span class="post-star" aria-label="즐겨찾기">★</span>' : "") + esc(p.title) +
            "</a></h2>" +
            '<div class="post-tags">' +
              (selMain === "all" ? '<span class="label">' + esc(p.main) + "</span>" : "") +
              '<span class="label">' + esc(p.cat) + "</span>" +
            "</div>";
        if (note) {
          html += '<span class="note-preview">메모 · ' +
            esc(note.replace(/\s+/g, " ").trim()) + "</span>";
        }
        html += "</div>";
        li.innerHTML = html;
        listEl.appendChild(li);
      });

      emptyEl.hidden = shown.length > 0;

      var libCount = document.getElementById("lib-count");
      if (libCount) {
        if (marked) { libCount.textContent = marked; libCount.hidden = false; }
        else { libCount.hidden = true; }
      }
    }

    mainRow.addEventListener("click", function (e) {
      var b = e.target.closest(".tab"); if (!b) return;
      selMain = b.getAttribute("data-val");
      selSub = "all";
      render();
    });
    subRow.addEventListener("click", function (e) {
      var b = e.target.closest(".chip"); if (!b) return;
      selSub = b.getAttribute("data-val");
      render();
    });
    favBtn.addEventListener("click", function () {
      favOnly = !favOnly;
      favBtn.classList.toggle("on", favOnly);
      favBtn.setAttribute("aria-pressed", favOnly ? "true" : "false");
      render();
    });

    if (window.CBK_onCatalog) window.CBK_onCatalog(function () { render(); });
    else render();

    // 자동 동기화: 코드가 있으면 목록을 열 때 원격을 받아오고, 끝나면 다시 그린다.
    if (CBK && CBK.sync && CBK.sync.isConfigured() && CBK.sync.getKey()) {
      CBK.sync.onSync(function () { render(); });
      CBK.sync.auto();
    }
  })();
  </script>
</body>
</html>
