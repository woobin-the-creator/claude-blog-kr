<!-- GitHub Pages 는 없는 경로에 이 파일을 준다(주소는 그대로 유지된다).

<nav id="site-nav-placeholder" class="site-header" aria-label="사이트">
  <div class="site-header-inner">
    <a class="site-brand" href="/claude-blog-kr/"><span class="brand-mark" aria-hidden="true">KR</span><span class="brand-text">Claude 블로그<span class="brand-sub"> 한글 번역</span></span></a>

    <div class="site-actions"><button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="테마 전환"><svg class="i-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7z"/></svg><svg class="i-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg></button><button type="button" class="icon-btn menu-toggle" data-menu-toggle aria-expanded="false" aria-controls="site-links" aria-label="메뉴"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button></div>

<!-- CBK_SITE_BASE: 이 파일은 주소창이 /claude-blog-kr/posts/<slug>.html 인 채로 실행된다.
     그래서 링크 기준을 상대경로가 아니라 Pages 베이스로 못박아야 사이트 밖으로 안 나간다. -->
<script>window.CBK_AT_ROOT = true; window.CBK_SITE_BASE = "/claude-blog-kr/"; window.CBK_ASSET_BASE = "/claude-blog-kr/posts/";</script>
