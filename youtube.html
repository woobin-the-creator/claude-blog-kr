<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>링크 → 포스트 큐 · Claude 블로그 한글 번역</title>
<script>try{var t=localStorage.getItem("cbk:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="posts/assets/site.css">
</head>
<body class="page-queue">
  <nav class="site-header" aria-label="사이트">
    <div class="site-header-inner">
      <a class="site-brand" href="index.html"><span class="brand-mark" aria-hidden="true">KR</span><span class="brand-text">Claude 블로그<span class="brand-sub"> 한글 번역</span></span></a>
      <div class="site-links" id="site-links">
        <a class="site-link" href="index.html">글 목록</a>
        <a class="site-link" href="library.html">보관함</a>
        <a class="site-link" href="youtube.html" aria-current="page">링크 큐</a>
        <a class="site-link" href="write.html">글쓰기</a>
      </div>
      <div class="site-actions">
        <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="테마 전환"><svg class="i-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7z"/></svg><svg class="i-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg></button>
        <button type="button" class="icon-btn menu-toggle" data-menu-toggle aria-expanded="false" aria-controls="site-links" aria-label="메뉴"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
      </div>
    </div>
  </nav>

  <main class="page narrow">
  <header class="page-head">
    <p class="label page-eyebrow">파이프라인</p>
    <h1 class="page-title">링크 → 포스트 큐</h1>
    <p class="page-sub">유튜브 영상이든 일반 블로그·문서 페이지든 URL을 넣어두면 맥의 파이프라인이
    순서대로 요약·해석한 한글 포스트로 만들어 올립니다.
    처리 주기는 약 10분이며, 한 건에 수 분이 걸립니다.</p>
  </header>

  <div id="app"></div>

  <footer class="site-footer">비공식 번역본 · 큐는 보관함과 같은 동기화 코드로 보호됩니다.</footer>
  </main>

  <script src="posts/assets/cbk-config.js"></script>
  <script src="posts/assets/store.js"></script>
  <script src="posts/assets/site.js"></script>
  <script>
  (function () {
    var CBK = window.CBK;
    var app = document.getElementById("app");

    function cfg() {
      var c = window.CBK_CONFIG || {};
      return { url: (c.supabaseUrl || "").replace(/\/+$/, ""), key: c.supabaseAnonKey || "" };
    }
    function rpc(fn, body) {
      var c = cfg();
      return fetch(c.url + "/rest/v1/rpc/" + fn, {
        method: "POST",
        headers: {
          "apikey": c.key,
          "Authorization": "Bearer " + c.key,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      }).then(function (r) {
        if (!r.ok) return r.text().then(function (t) {
          // PostgREST 에러 JSON에서 message만 추리기
          var msg = t;
          try { msg = JSON.parse(t).message || t; } catch (e) {}
          throw new Error(msg);
        });
        return r.status === 204 ? null : r.json();
      });
    }

    var syncKey = (CBK && CBK.sync && CBK.sync.getKey && CBK.sync.getKey()) || "";
    var configured = CBK && CBK.sync && CBK.sync.isConfigured && CBK.sync.isConfigured();

    if (!configured || !syncKey) {
      app.innerHTML =
        '<div class="nokey">이 페이지는 <a href="library.html">보관함</a>의 동기화 코드가 있어야 씁니다.' +
        "<br>보관함 → 기기 간 동기화에서 코드를 만들거나 입력한 뒤 다시 열어주세요.</div>";
      return;
    }

    app.innerHTML =
      '<section class="enqueue panel">' +
        '<div class="enqueue-row">' +
          '<input type="url" id="yt-url" placeholder="유튜브 영상 또는 블로그·문서 페이지 주소 (https://…)"' +
            ' autocomplete="off" spellcheck="false">' +
          '<button type="button" id="yt-add">큐에 넣기</button>' +
        "</div>" +
        '<p class="enqueue-hint">유튜브는 공개 영상만 가능합니다(비공개·일부공개는 Gemini가 못 봅니다).' +
          " 일반 페이지는 로그인·유료 구독 없이 열리는 주소여야 본문을 읽어옵니다." +
          " 완료되면 텔레그램으로 알림이 옵니다.</p>" +
        '<p class="enqueue-msg" id="yt-msg"></p>' +
      "</section>" +
      '<div class="qhead"><h2>큐 상태</h2><button type="button" id="yt-refresh">새로고침</button></div>' +
      '<div id="yt-list"></div>';

    var urlEl = document.getElementById("yt-url");
    var addBtn = document.getElementById("yt-add");
    var msgEl = document.getElementById("yt-msg");
    var listEl = document.getElementById("yt-list");

    // 서버(DB 함수)가 던진 메시지를 사람 말로 옮긴다.
    // 'not a youtube url' 은 유튜브 전용이던 옛 cbk_yt_enqueue 만 던진다 →
    // 일반 주소가 막힌 게 아니라 DB 스키마가 아직 안 올라간 상태라는 뜻.
    function explain(msg) {
      msg = String(msg || "");
      if (/not a youtube url/.test(msg)) {
        return "서버의 큐 함수가 아직 유튜브 전용 옛 버전입니다. " +
               "Supabase에서 supabase/schema-youtube-queue.sql 을 다시 실행해주세요.";
      }
      if (/not a http url/.test(msg)) {
        return "http(s)로 시작하는 주소만 넣을 수 있습니다.";
      }
      if (/invalid sync key/.test(msg)) {
        return "동기화 코드가 올바르지 않습니다. 보관함에서 다시 확인해주세요.";
      }
      return msg;
    }
    function setMsg(text, kind) {
      msgEl.textContent = text || "";
      msgEl.className = "enqueue-msg" + (kind ? " " + kind : "");
    }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    function fmt(ts) {
      try {
        var d = new Date(ts);
        return d.toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" }) + " " +
               d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      } catch (e) { return ts; }
    }
    var LABEL = { pending: "대기 중", processing: "처리 중", done: "완료", error: "실패" };
    // 워커와 같은 규칙으로 유튜브/일반 문서를 구분한다.
    function kindIcon(url) {
      return /^https?:\/\/([^\/]*\.)?(youtube\.com|youtu\.be)\//i.test(url) ? "📺" : "🔗";
    }

    function render(rows) {
      if (!rows || !rows.length) {
        listEl.innerHTML = '<div class="empty">아직 큐에 넣은 링크가 없습니다.</div>';
        return;
      }
      listEl.innerHTML = "";
      rows.forEach(function (r) {
        var el = document.createElement("div");
        el.className = "qitem";
        var body = '<div class="qbody"><span class="qurl">' +
          (r.status === "done" && r.post_slug
            ? '<a href="posts/' + esc(r.post_slug) + '.html">' + esc(r.url) + "</a>"
            : esc(r.url)) +
          "</span>" +
          '<span class="qmeta">' + kindIcon(r.url) + " " + fmt(r.created_at) + " 등록" +
            (r.status === "done" && r.post_slug ? " · posts/" + esc(r.post_slug) + ".html" : "") +
          "</span>" +
          (r.status === "error" && r.error ? '<span class="qerr">' + esc(r.error) + "</span>" : "") +
          "</div>";
        var badge = '<span class="qbadge ' + esc(r.status) + '">' +
          (LABEL[r.status] || esc(r.status)) + "</span>";
        var acts = "";
        if (r.status === "error") {
          acts = '<span class="qact"><button type="button" data-act="retry">재시도</button>' +
                 '<button type="button" data-act="remove">삭제</button></span>';
        } else if (r.status === "pending" || r.status === "done") {
          acts = '<span class="qact"><button type="button" data-act="remove">삭제</button></span>';
        }
        el.innerHTML = body + badge + acts;

        el.querySelectorAll("[data-act]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var act = btn.getAttribute("data-act");
            var p = act === "retry"
              ? rpc("cbk_yt_finish", { p_key: syncKey, p_id: r.id, p_status: "pending" })
              : rpc("cbk_yt_remove", { p_key: syncKey, p_id: r.id });
            p.then(refresh).catch(function (e) { setMsg("실패: " + e.message, "err"); });
          });
        });
        listEl.appendChild(el);
      });
    }

    function refresh() {
      return rpc("cbk_yt_list", { p_key: syncKey })
        .then(render)
        .catch(function (e) { setMsg("목록을 못 불러왔습니다: " + e.message, "err"); });
    }

    function enqueue() {
      var url = urlEl.value.trim();
      if (!url) { urlEl.focus(); return; }
      addBtn.disabled = true;
      setMsg("등록 중…", "");
      rpc("cbk_yt_enqueue", { p_key: syncKey, p_url: url })
        .then(function () {
          urlEl.value = "";
          setMsg("큐에 넣었습니다. 다음 주기에 처리됩니다.", "ok");
          return refresh();
        })
        .catch(function (e) {
          setMsg("등록 실패: " + explain(e.message), "err");
        })
        .then(function () { addBtn.disabled = false; });
    }

    addBtn.addEventListener("click", enqueue);
    urlEl.addEventListener("keydown", function (e) { if (e.key === "Enter") enqueue(); });
    document.getElementById("yt-refresh").addEventListener("click", refresh);

    refresh();
    // 처리 중인 항목이 보이는 동안엔 1분마다 자동 새로고침
    setInterval(function () {
      if (listEl.querySelector(".qbadge.processing, .qbadge.pending")) refresh();
    }, 60000);
  })();
  </script>
</body>
</html>
