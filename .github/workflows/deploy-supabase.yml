name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/supabase-admin.mjs'
      - 'scripts/migrate-posts.mjs'
      - 'posts/assets/posts.js'
      - 'posts/*.html'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CBK_SYNC_KEY: ${{ secrets.CBK_SYNC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Test before production deployment
        working-directory: tests
        run: npm test
      - name: Check deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }
          test -n "$CBK_SYNC_KEY" || { echo "CBK_SYNC_KEY secret is missing"; exit 1; }
      - name: Apply immutable migrations and seed owner
        run: node scripts/supabase-admin.mjs deploy
      - name: Import missing legacy posts without overwriting DB edits
        if: ${{ hashFiles('posts/assets/posts.js') != '' }}
        run: node scripts/migrate-posts.mjs
      - name: Verify production invariants
        run: node scripts/supabase-admin.mjs verify
