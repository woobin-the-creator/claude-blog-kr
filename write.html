<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>글쓰기 · Claude 블로그 한글 번역</title><link rel="stylesheet" href="posts/assets/authoring.css"></head>
<body><main class="writer">
<a href="index.html">← 글 목록</a> · <a href="library.html">보관함 · 동기화 설정</a>
<h1>글쓰기</h1><p class="help">발행하면 바로 공개됩니다. AI 첨삭은 발행 후 별도로 진행되며 글을 자동 수정하지 않습니다.</p>
<div class="tabs" role="tablist" aria-label="글 관리">
<button type="button" role="tab" aria-selected="true" aria-controls="tab-edit" id="edit-tab" data-tab="edit" class="on">편집</button>
<button type="button" role="tab" aria-selected="false" aria-controls="tab-review" id="review-tab" data-tab="review" tabindex="-1">리뷰</button></div>
<section id="tab-edit" role="tabpanel" aria-labelledby="edit-tab">
<p id="w-loading" hidden role="status">글을 불러오는 중…</p>
<div class="meta-grid">
<label>슬러그 *<input id="w-slug" required placeholder="my-first-post" maxlength="121" aria-describedby="slug-help"></label>
<label>제목 *<input id="w-title" required placeholder="글 제목" maxlength="300"></label>
<label>짧은 제목<input id="w-nav" placeholder="비우면 제목 사용"></label>
<label>출처<input id="w-main" value="내 글"></label>
<label>주제<input id="w-cat" placeholder="에세이"></label>
<label>날짜 *<input id="w-date" type="date" required></label>
</div><p id="slug-help" class="help">슬러그는 글 주소입니다. 영문 소문자·숫자·하이픈을 쓰세요. 발행 후에는 바꿀 수 없습니다.</p>
<div class="split"><div><label for="w-body">본문 (마크다운) *</label><textarea id="w-body" required placeholder="마크다운으로 글을 써보세요."></textarea></div>
<div><span id="preview-label">미리보기</span><div id="w-preview" aria-labelledby="preview-label"></div></div></div>
<p class="help">이미지: ![설명](https://이미지주소) · 링크: [텍스트](https://주소) · 원문 HTML은 실행되지 않습니다.</p>
<div class="actions"><button id="w-publish" type="button">발행</button><a class="button" href="write.html?new=1">새 글</a><span id="w-msg" role="status" aria-live="polite"></span></div>
</section>
<section id="tab-review" role="tabpanel" aria-labelledby="review-tab" hidden><button id="rv-refresh" type="button">리뷰 새로고침</button><p class="help">Mac이 켜져 있으면 새 글과 수정된 글을 자동 첨삭합니다. ‘반영함’은 수정 완료 표시이며 본문을 바꾸지 않습니다.</p><div id="review-list"></div></section>
</main>
<script src="posts/assets/cbk-config.js"></script><script src="posts/assets/store.js"></script><script src="posts/assets/catalog.js"></script>
<script src="posts/assets/markdown.js"></script><script src="posts/assets/reviews.js"></script><script src="posts/assets/write.js"></script>
</body></html>
